name: opspilot

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://opspilot:opspilot@db:5432/opspilot
  SOAP_URL: http://soap:8001/?wsdl
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  TEST_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@db:5432/opspilot_test

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 3s
      timeout: 3s
      retries: 30

  soap:
    build: .
    image: opspilot:latest
    command: ["python", "-m", "opspilot.soap.service", "--host", "0.0.0.0", "--port", "8001"]
    environment: *app-env
    ports:
      - "${SOAP_HOST_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: opspilot:latest
    command: ["sh", "scripts/start-api.sh"]
    environment: *app-env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # reports written by `make seed` / `make eval` land in the working tree
      - ./eval:/app/eval
      - ./migration:/app/migration
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach a host LLM such as Ollama
    depends_on:
      db:
        condition: service_healthy
      soap:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  pgdata:
