[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Agentic AI copilot for ERP & supply chain: LangGraph, FastAPI, PostgreSQL/pgvector, REST+SOAP, RAG, evals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "atharv1183" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "spyne==2.14.0",
    "zeep>=4.2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "faker>=30",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:spyne.*", "ignore::SyntaxWarning"]

[tool.ruff.lint.isort]
known-first-party = ["opspilot", "migration", "eval"]
known-third-party = ["alembic"]
